[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "freshgram-updates-notify"
version = "0.1.0"
description = "Independent Telegram notifications for freshGram releases"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.5",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[project.scripts]
freshupdate = "freshupdate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freshupdate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
