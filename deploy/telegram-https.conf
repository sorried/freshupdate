limit_req_zone $binary_remote_addr zone=freshupdate_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=freshupdate_connections:1m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telegram.exteragram.xyz;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/telegram.exteragram.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telegram.exteragram.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/freshupdate.access.log;
    error_log /var/log/nginx/freshupdate.error.log warn;

    location = /updates {
        if ($request_method != POST) { return 405; }
        limit_req zone=freshupdate_requests burst=20 nodelay;
        limit_conn freshupdate_connections 10;
        proxy_pass http://127.0.0.1:18754;
        proxy_http_version 1.1;
        proxy_set_header Host telegram.exteragram.xyz;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }
}
